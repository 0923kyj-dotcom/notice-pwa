<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청주대 알리미 · 학생용 (시연판)</title>
<meta name="description" content="공지 마감 알리미 시연판 · 비공식 학생 프로젝트">
<meta name="theme-color" content="#2F6FE4">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="알리미 학생용">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="band" id="band">
      <p class="band-text"><span id="bandText">불러오는 중…</span><span class="band-warn" id="bandWarn" hidden></span></p>
      <button type="button" class="btn-ghost" id="baseBtn">변경</button>
      <button type="button" class="icon-btn" id="infoBtn" aria-label="정보">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      </button>
    </div>
    <div class="chips" id="chips" role="radiogroup" aria-label="관심 분야"></div>
  </header>

  <main id="main">
    <section class="view" id="v-home" data-view="home" aria-label="홈"></section>
    <section class="view" id="v-cal" data-view="cal" aria-label="달력" hidden></section>
    <section class="view" id="v-rep" data-view="rep" aria-label="반복 공지" hidden></section>
    <section class="view" id="v-find" data-view="find" aria-label="찾기" hidden></section>
  </main>

  <nav class="tabs" aria-label="화면">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg><span>홈</span></a>
    <a href="#cal" data-tab="cal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>달력</span></a>
    <a href="#rep" data-tab="rep">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg><span>반복 공지</span></a>
    <a href="#find" data-tab="find">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>찾기</span></a>
  </nav>
</div>

<!-- 기준일 설정 시트 -->
<dialog class="sheet" id="baseSheet" aria-labelledby="baseTitle">
  <div class="sheet-head">
    <h2 id="baseTitle">시연 기준일</h2>
    <button type="button" class="icon-btn" data-close aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="preset-list" id="presetList" role="radiogroup" aria-label="기준일 프리셋"></div>
  <label class="date-pick">
    <span>날짜 직접 고르기</span>
    <input type="date" id="baseDate" min="2025-10-01" max="2027-12-31">
  </label>
</dialog>

<!-- 정보 시트 (내용은 4단계) -->
<dialog class="sheet" id="infoSheet" aria-labelledby="infoTitle">
  <div class="sheet-head">
    <h2 id="infoTitle">정보</h2>
    <button type="button" class="icon-btn" data-close aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="infoBody"></div>
</dialog>

<!-- 공지 상세 시트 -->
<dialog class="sheet" id="detailSheet" aria-labelledby="detailTitle">
  <div class="sheet-head">
    <span class="sheet-kicker">공지 상세</span>
    <button type="button" class="icon-btn" data-close aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="detailBody"></div>
</dialog>

<!-- 아이폰 설치 안내 시트 -->
<dialog class="sheet" id="iosSheet" aria-labelledby="iosTitle">
  <div class="sheet-head">
    <h2 id="iosTitle">홈 화면에 추가</h2>
    <button type="button" class="icon-btn" data-close aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="ios-note" id="iosNotifyNote" hidden>아이폰은 홈 화면에 추가한 앱에서만 알림을 받을 수 있습니다.</p>
  <ol class="ios-steps">
    <li>
      <svg class="ios-art" viewBox="0 0 120 64" aria-hidden="true">
        <rect x="4" y="18" width="112" height="40" rx="10" class="a-bar"/>
        <path d="M22 38h10M27 33l-5 5 5 5" class="a-ico"/><path d="M88 38h10M93 33l5 5-5 5" class="a-ico"/>
        <circle cx="60" cy="38" r="14" class="a-hl"/>
        <path d="M54 36v9h12v-9M60 28v11M56 31.5l4-4 4 4" class="a-ico a-strong"/>
      </svg>
      <p><b>1</b> Safari 아래(또는 위)의 <b>공유</b> 버튼</p>
    </li>
    <li>
      <svg class="ios-art" viewBox="0 0 120 64" aria-hidden="true">
        <rect x="4" y="6" width="112" height="22" rx="6" class="a-bar"/><rect x="12" y="13" width="50" height="8" rx="3" class="a-line"/>
        <rect x="4" y="33" width="112" height="26" rx="6" class="a-hl-row"/>
        <text x="12" y="50" class="a-txt">홈 화면에 추가</text>
        <rect x="94" y="39" width="14" height="14" rx="3" class="a-ico a-strong"/><path d="M101 42.5v7M97.5 46h7" class="a-ico a-strong"/>
      </svg>
      <p><b>2</b> 메뉴를 내려 <b>홈 화면에 추가</b></p>
    </li>
    <li>
      <svg class="ios-art" viewBox="0 0 120 64" aria-hidden="true">
        <rect x="4" y="10" width="112" height="44" rx="8" class="a-bar"/>
        <rect x="12" y="20" width="24" height="24" rx="6" class="a-app"/>
        <path d="M18 31l4 4 8-8" class="a-ico a-white"/>
        <rect x="44" y="27" width="28" height="8" rx="3" class="a-line"/>
        <rect x="78" y="15" width="34" height="18" rx="9" class="a-hl"/><text x="95" y="28" text-anchor="middle" class="a-txt a-blue">추가</text>
      </svg>
      <p><b>3</b> 오른쪽 위 <b>추가</b> → 홈 화면 아이콘으로 실행</p>
    </li>
  </ol>
  <p class="note">iOS 16.4 이상 · 설치한 앱에서 알림을 허용하면 아이콘에 숫자가 보입니다</p>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="./app.js"></script>
</body>
</html>
